name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create --org com.example --project-name live_app app
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          cd app
          sed -i 's/flutter\.minSdkVersion/24/' android/app/build.gradle*
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          set +e
          flutter build apk --release --no-shrink --target-platform android-arm64 > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo '## BUILD ERROR - is poore text ka screenshot bhejo'
              echo '```'
              grep -n -A12 -E "What went wrong|Execution failed|error:" build.log | head -45
              echo '--- LOG KA AAKHRI HISSA ---'
              tail -n 25 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
